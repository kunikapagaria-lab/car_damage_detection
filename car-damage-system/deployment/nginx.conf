# ── DamageVision production Nginx configuration ──────────────────────────────
# Reverse proxy for Next.js (3000), Backend API (8000), Inference (8001)
# WebSocket upgrade for /ws/
# Gzip compression, rate limiting, SSL-ready placeholders

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/html
        image/svg+xml
        application/xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m      rate=60r/m;
    limit_req_zone  $binary_remote_addr  zone=login_limit:5m     rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=report_limit:5m    rate=5r/m;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # ── Upstream blocks ───────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    upstream backend_api {
        server backend-api:8000;
        keepalive 32;
    }

    upstream inference_svc {
        server inference-service:8001;
        keepalive 16;
    }

    # ── Shared proxy headers ──────────────────────────────────────────────────
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      120s;
    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;

    # ── HTTP → HTTPS redirect (uncomment after SSL setup) ────────────────────
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        # listen 443 ssl http2;           # uncomment for SSL
        server_name _;

        # ── SSL (certbot-managed — uncomment after: certbot --nginx) ─────────
        # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache   shared:SSL:10m;
        # ssl_session_timeout 10m;
        # add_header Strict-Transport-Security "max-age=63072000" always;

        client_max_body_size 50M;
        limit_conn conn_limit 50;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"              always;
        add_header X-Content-Type-Options "nosniff"                 always;
        add_header X-XSS-Protection       "1; mode=block"           always;
        add_header Referrer-Policy        "strict-origin"            always;

        # ── WebSocket live feed (inference service) ───────────────────────────
        location /ws/ {
            proxy_pass          http://inference_svc;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── Backend REST API ─────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_api;
        }

        # Rate-limit auth endpoint more aggressively
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend_api;
        }

        # Heavy report endpoint — low rate limit
        location ~ ^/api/v1/scans/[^/]+/report$ {
            limit_req zone=report_limit burst=2 nodelay;
            proxy_pass         http://backend_api;
            proxy_read_timeout 300s;    # PDF generation can be slow
        }

        # ── Inference service API (prefixed) ─────────────────────────────────
        location /inference/ {
            limit_req zone=api_limit burst=10 nodelay;
            rewrite ^/inference/(.*)$ /$1 break;
            proxy_pass http://inference_svc;
        }

        # ── MinIO console (admin only) ────────────────────────────────────────
        location /minio/ {
            rewrite ^/minio/(.*)$ /$1 break;
            proxy_pass http://minio:9001;
        }

        # ── Health check (bypasses rate limiting) ─────────────────────────────
        location /health {
            proxy_pass http://backend_api;
            access_log off;
        }

        # ── Next.js frontend (catch-all) ──────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            # Next.js hot reload websocket
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Error pages ───────────────────────────────────────────────────────
        error_page 429 @too_many_requests;
        location @too_many_requests {
            default_type application/json;
            return 429 '{"success":false,"error":"too_many_requests","data":null,"meta":{}}';
        }

        error_page 502 503 504 @gateway_error;
        location @gateway_error {
            default_type application/json;
            return 502 '{"success":false,"error":"gateway_error","data":null,"meta":{}}';
        }
    }
}
